[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/thi-dua/ai-status"
  to = "/.netlify/functions/thi-dua-ai-status"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
