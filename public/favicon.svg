<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Nền xanh Navy Corporate Technology chuyển sắc tinh tế -->
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#0B4DA8" />
      <stop offset="42%" stop-color="#082B59" />
      <stop offset="100%" stop-color="#031530" />
    </linearGradient>

    <!-- Ánh sáng góc trên trái nhẹ nhàng -->
    <radialGradient id="topGlow" cx="18%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#1A6ED8" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#082B59" stop-opacity="0" />
    </radialGradient>

    <!-- Gradient Cột Cyan -> Xanh Dương đậm (Phần dưới đường tăng trưởng) -->
    <linearGradient id="barCyanBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00EEFF" />
      <stop offset="45%" stop-color="#0095FF" />
      <stop offset="100%" stop-color="#0048F0" />
    </linearGradient>

    <!-- Gradient Phần trên Cột 1 & 2 (Trắng -> Xanh Băng sáng) -->
    <linearGradient id="barWhiteIce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E3F4FF" />
      <stop offset="100%" stop-color="#B3DEFF" />
    </linearGradient>

    <!-- Gradient Đường mũi tên tăng trưởng (Trắng sáng -> Xanh Băng) -->
    <linearGradient id="arrowGrad" x1="15%" y1="85%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#B8E1FF" />
      <stop offset="55%" stop-color="#EFF8FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Khung vuông bo góc mềm -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgNavy)" />
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#topGlow)" />

  <!-- PHẦN TRÊN CỘT 1 (Trắng - Băng, nằm phía trên đường cong) -->
  <path
    d="M 116 292
       H 172
       A 10 10 0 0 1 182 302
       V 334
       C 158 345, 132 354, 106 360
       V 302
       A 10 10 0 0 1 116 292 Z"
    fill="url(#barWhiteIce)"
  />

  <!-- PHẦN TRÊN CỘT 2 (Trắng - Băng, nằm phía trên đường cong) -->
  <path
    d="M 228 214
       H 284
       A 10 10 0 0 1 294 224
       V 252
       C 272 273, 246 293, 218 310
       V 224
       A 10 10 0 0 1 228 214 Z"
    fill="url(#barWhiteIce)"
  />

  <!-- PHẦN DƯỚI CỘT 1 (Cyan - Blue) -->
  <path
    d="M 106 396
       C 132 391, 158 382, 182 371
       V 418
       A 8 8 0 0 1 174 426
       H 114
       A 8 8 0 0 1 106 418
       Z"
    fill="url(#barCyanBlue)"
  />

  <!-- PHẦN DƯỚI CỘT 2 (Cyan - Blue) -->
  <path
    d="M 218 351
       C 246 334, 272 314, 294 292
       V 418
       A 8 8 0 0 1 286 426
       H 226
       A 8 8 0 0 1 218 418
       Z"
    fill="url(#barCyanBlue)"
  />

  <!-- CỘT 3 CAO NHẤT BÊN PHẢI (Cyan - Blue rực rỡ, vát chéo theo đường mũi tên) -->
  <path
    d="M 330 268
       C 343 252, 355 236, 366 220
       H 396
       A 10 10 0 0 1 406 230
       V 418
       A 8 8 0 0 1 398 426
       H 338
       A 8 8 0 0 1 330 418
       Z"
    fill="url(#barCyanBlue)"
  />

  <!-- ĐƯỜNG BIỂU ĐỒ TĂNG TRƯỞNG CONG VÚT LÊN + MŨI TÊN TRẮNG SÁNG -->
  <path
    d="M 68 386
       C 162 374, 266 308, 344 166
       L 308 148
       L 394 94
       L 408 194
       L 372 178
       C 288 332, 176 392, 68 392
       Z"
    fill="url(#arrowGrad)"
  />
</svg>

