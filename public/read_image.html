<!DOCTYPE html>
<html>
<head>
  <title>Read Image</title>
</head>
<body>
  <img id="source" src="file:///Users/linhvu/.gemini/antigravity-ide/brain/c95d7874-abec-4cd9-8c0c-d8ba006c5344/media__1782270238316.png" crossOrigin="anonymous">
  <canvas id="canvas"></canvas>
  <textarea id="output" style="width: 100%; height: 300px;"></textarea>
  <div id="status">Loading...</div>

  <script>
    const img = document.getElementById('source');
    const canvas = document.getElementById('canvas');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    img.onload = function() {
      try {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        
        // Try getting data URL
        const dataURL = canvas.toDataURL('image/png');
        output.value = dataURL;
        status.innerText = "Success!";
      } catch (err) {
        status.innerText = "Error: " + err.message;
        console.error(err);
      }
    };

    img.onerror = function(e) {
      status.innerText = "Img Load Error: failed to load source image.";
    };
  </script>
</body>
</html>
